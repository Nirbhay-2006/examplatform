<div class="course-container">

  <div *ngFor="let course of courses" class="course-card">

    <img
      class="thumbnail"
      [src]="'https://localhost:44385' + course.thumbnailUrl"
    />

    <div class="card-body">

      <h3>{{ course.title }}</h3>

      <p class="price">₹ {{ course.fees }}</p>

      <div class="dates">
        <span>Start: {{ course.startDate | date }}</span>
        <span>End: {{ course.endDate | date }}</span>
      </div>

      <button class="subscribe-btn" (click)="subscribe(course.courseId)">
        Subscribe
      </button>

    </div>

  </div>

</div>
