<div class="modal-overlay" (click)="onClose()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2>Upgrade to Premium</h2>
            <button class="close-btn" (click)="onClose()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="plan-comparison">
                <div class="plan free">
                    <h3>Free Plan</h3>
                    <ul>
                        <li>Max 5 Exams</li>
                        <li>Limited Students (40/exam)</li>
                        <li>Standard Support</li>
                    </ul>
                </div>
                <div class="plan premium">
                    <h3>Premium Plan</h3>
                    <div class="badge">Recommended</div>
                    <ul>
                        <li><strong>Unlimited Exams</strong></li>
                        <li><strong>Unlimited Students</strong></li>
                        <li>Priority Support</li>
                        <li>Advanced Anti-Cheating Logs</li>
                    </ul>
                    <div class="price">$19.99 / month</div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" (click)="onClose()">Maybe Later</button>
            <button class="btn-upgrade" (click)="upgrade()" [disabled]="isLoading">
                @if (isLoading) {
                <span class="spinner"></span> Processing...
                } @else {
                Upgrade Now
                }
            </button>
        </div>
    </div>
</div>
