<div
    class="login-container d-flex align-items-center justify-content-center min-vh-100 position-relative overflow-hidden">
    <!-- Animated Decoration Circles -->
    <div class="decoration-circle circle-1"></div>
    <div class="decoration-circle circle-2"></div>

    <div class="container position-relative z-2">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="card glass-panel border-0 animate__animated animate__fadeInUp">
                    <div class="card-body p-5">
                        <div class="text-center mb-5">
                            <h1 class="h3 fw-bold text-gradient mb-2">Welcome Back</h1>
                            <p class="text-muted small">Sign in to continue to ExamNest</p>
                        </div>

                        <form (ngSubmit)="onSubmit()">
                            <div *ngIf="error"
                                class="alert alert-danger small p-2 mb-3 bg-danger-subtle text-danger border-0 rounded-3">
                                <i class="bi bi-exclamation-circle-fill me-2"></i>{{ error }}
                            </div>

                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="floatingInput"
                                    placeholder="name@example.com" [(ngModel)]="credentials.email" name="email"
                                    required>
                                <label for="floatingInput">Email address</label>
                            </div>
                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="floatingPassword" placeholder="Password"
                                    [(ngModel)]="credentials.password" name="password" required>
                                <label for="floatingPassword">Password</label>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                    <label class="form-check-label small text-muted" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>
                                <a href="#" class="small text-decoration-none text-primary fw-medium">Forgot
                                    password?</a>
                            </div>

                            <button type="submit"
                                class="btn btn-primary-gradient w-100 py-3 rounded-3 fw-semibold mb-4">
                                Sign In <i class="bi bi-arrow-right ms-2"></i>
                            </button>

                            <div class="text-center">
                                <span class="text-muted small">Don't have an account?</span>
                                <a routerLink="/auth/register"
                                    class="text-primary text-decoration-none small fw-semibold ms-1">Create Account</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
